[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polars-decision-tree"
version = "0.1.0"
description = "Out-of-core, level-wise ID3 decision trees built with Polars"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "polars-decision-tree contributors" }]
dependencies = [
    "polars>=1.30,<3",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pyarrow>=14",
]
dev = [
    "pytest>=8",
    "pyarrow>=14",
    "psutil>=5.9",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
